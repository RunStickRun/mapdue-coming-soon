<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MapDue — Coming soon</title>
<meta name="description" content="MapDue — property management for commercial sites and field teams. Coming soon.">
<meta name="robots" content="index,follow">
<link rel="icon" href="logo.png" type="image/png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#F7F4EC;font-family:Inter,system-ui,sans-serif;color:#0A0A0A}
.frame{min-height:100vh;position:relative;background:radial-gradient(ellipse at 70% 35%,#FFF9EE 0%,#F7F4EC 55%,#EFE8DA 100%);display:flex;flex-direction:column;align-items:center;padding:48px 24px 72px}
.logo{height:72px;width:auto;margin-top:12px}
.stage{width:100%;max-width:920px;text-align:center;margin:auto;padding:24px 0 48px}
.mascot{height:min(38vh,320px);width:auto;margin:0 auto 20px;display:block;filter:drop-shadow(0 18px 40px rgba(0,0,0,.12))}
.h1{font-size:clamp(36px,6vw,72px);line-height:1.08;font-weight:700;letter-spacing:-.02em}
.h1 span{color:#C9A227}
.goldline{width:96px;height:4px;background:#C9A227;margin:28px auto 0}
.sub{margin-top:22px;font-size:clamp(17px,2.4vw,24px);line-height:1.45;color:#3A3A3A;font-weight:450;max-width:36em;margin-left:auto;margin-right:auto}
.soon{margin-top:40px;font-size:clamp(18px,2.2vw,22px);font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#0A0A0A}
.foot{margin-top:auto;text-align:center;font-size:13px;color:#8A8578;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="frame">
    <img class="logo" src="logo.png" alt="MapDue">
    <div class="stage">
      <img class="mascot" src="mascot-char.png" alt="MapDude — MapDue mascot">
      <h1 class="h1">Run the property.<br><span>End to end.</span></h1>
      <div class="goldline"></div>
      <p class="sub">For commercial sites and field teams — assets, inventory, maintenance, and vendors in one place.</p>
      <p class="soon">Coming Soon</p>
    </div>
    <p class="foot">mapdue.com · coming soon</p>
  </div>
</body>
</html>
